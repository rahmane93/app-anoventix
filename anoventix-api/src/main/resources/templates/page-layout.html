<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}} — AnoventiX</title>
    <!-- Mise en page commune aux pages servies par l'API (Utility.renderPage). -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f2f2f2;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        color: #111827;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrapper { width: 100%; max-width: 480px; padding: 40px 16px; }
      .card { background: #fff; border-radius: 12px; border-top: 4px solid #d4a017; overflow: hidden; box-shadow: 0 2px 10px rgba(17, 24, 39, 0.06); }
      .header { padding: 20px 32px; border-bottom: 1px solid #ede6dc; }
      .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; text-decoration: none; color: #1a3c6e; }
      .logo span { color: #d4a017; }
      .body { padding: 32px; }
      .icon { width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; margin-bottom: 20px; }
      .icon.success { background: #d1fae5; color: #047857; }
      .icon.error { background: #fee2e2; color: #b91c1c; }
      h1 { margin: 0 0 12px; font-size: 22px; line-height: 1.3; }
      p { margin: 0 0 20px; font-size: 15px; line-height: 1.7; color: #4b5563; }
      .alert { margin: 0 0 20px; padding: 12px 16px; border-radius: 8px; background: #fee2e2; color: #b91c1c; font-size: 14px; line-height: 1.5; }
      .actions { display: flex; flex-direction: column; gap: 10px; }
      .btn { display: block; text-align: center; padding: 14px 20px; border-radius: 10px; font-size: 15px; font-weight: 700; text-decoration: none; }
      .btn.primary { background: #1a3c6e; color: #fff; }
      .btn.secondary { background: #eef3fb; color: #1a3c6e; }
      .hint { margin: 16px 0 0; font-size: 13px; color: #6b7280; }
      .footer { text-align: center; padding: 20px 16px 0; font-size: 12px; color: #6b7280; line-height: 1.8; }
      .footer a { color: #1a3c6e; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="card">
        <div class="header"><a class="logo" href="https://www.anoventix.com">Anovent<span>iX</span></a></div>
        <div class="body">
{{content}}
        </div>
      </div>
      <div class="footer">
        <a href="https://www.anoventix.com">www.anoventix.com</a> &middot;
        <a href="mailto:contact@anoventix.com">contact@anoventix.com</a><br />
        &copy; {{year}} AnoventiX
      </div>
    </div>
  </body>
</html>
