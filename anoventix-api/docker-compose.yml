services:
  app:
    build: .
    container_name: anoventix-api
    expose:
      - "8080"  # joignable uniquement via anoventix-edge
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      # L'API n'est joignable que via nginx, qui écrase X-Forwarded-For avec l'IP réelle.
      - TRUST_XFF=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_uploads:/app/uploads
      # Export web lu par SharePageService pour servir /annonce/* avec les balises Open Graph.
      - ../anoventix-edge/web:/var/www/web:ro
    networks:
      - anoventix-network
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: postgres-db
    expose:
      - "5432"
#    ports:
#      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - anoventix-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: anoventix_postgres_data
  app_uploads:
    name: anoventix_uploads

networks:
  # Partagé avec anoventix-edge (nginx) : `docker network create anoventix-network` une fois.
  anoventix-network:
    name: anoventix-network
    external: true
