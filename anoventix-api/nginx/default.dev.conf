server {
    listen 80;
    server_name localhost;

    client_max_body_size 100m;

    # Fichiers privés — jamais servis directement
    location /uploads/private/ {
        deny all;
    }

    # Fichiers publics — servis statiquement par nginx
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Swagger UI (dev uniquement)
    location /swagger-ui.html {
        return 301 /swagger-ui/index.html;
    }

    location /swagger-ui/ {
        proxy_pass         http://app:8080/swagger-ui/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass         http://app:8080/v3/api-docs;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Activation de compte (page HTML servie par Spring Boot)
    location /activate {
        proxy_pass         http://app:8080/activate;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Toutes les autres requêtes → Spring Boot
    location / {
        proxy_pass         http://app:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
