server {
    listen 80;
    server_name anoventix.com www.anoventix.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.anoventix.com;

    ssl_certificate     /etc/letsencrypt/live/anoventix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anoventix.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Application web (export statique Expo), déposée par anoventix-app/scripts/deploy-web.ps1 :
    # web/releases/<date>/ et web/current → version en ligne. Le lien est basculé d'un coup,
    # ce qui rend le déploiement atomique (et le retour arrière immédiat).
    root /var/www/web/current;
    index index.html;

    # HTML revalidé à chaque visite : un déploiement est visible tout de suite.
    # (Les blocs qui posent leurs propres en-têtes remplacent celui-ci.)
    add_header Cache-Control "no-cache" always;

    # APK Android déposé à la main dans ~/app/anoventix-api/downloads/ (hors git).
    # Nom stable (anoventix.apk) : une nouvelle version remplace simplement le fichier.
    location /downloads/ {
        alias /var/www/downloads/;
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache" always;
    }

    # Anciens liens de la landing (/telecharger/anoventix.apk).
    location /telecharger/ {
        rewrite ^/telecharger/(.*)$ /downloads/$1 permanent;
    }

    # Pages légales de l'ancienne landing, liées depuis l'app (src/constants/legal.ts).
    location = /cgu             { root /var/www/landing; try_files /cgu.html =404; }
    location = /confidentialite { root /var/www/landing; try_files /confidentialite.html =404; }

    # JS/CSS nommés par empreinte : ils ne changent jamais, cache d'un an.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Fiche annonce : même fichier annonce/[id].html, mais servi par l'API qui y injecte les
    # balises Open Graph (aperçu Facebook/WhatsApp…) et redirige les anciens liens /annonce/30
    # vers /annonce/<slug>-<publicId> (cf. SharePageService).
    # (rewrite + proxy_pass sans variable : pas besoin de « resolver » pour le nom Docker.)
    location ~ ^/annonce/[^/]+/?$ {
        rewrite ^/annonce/([^/]+)/?$ /share/annonce/$1 break;
        proxy_pass         http://anoventix-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # API indisponible : on sert quand même l'app (sans aperçu) plutôt qu'une erreur.
        proxy_intercept_errors on;
        error_page 502 503 504 = @annonce_statique;
    }
    location @annonce_statique { try_files "/annonce/[id].html" =404; }

    # Autres écrans à identifiant : l'export produit un seul fichier par route,
    # que l'app complète côté navigateur à partir de l'adresse.
    location ~ ^/profil/[^/]+/?$                     { try_files "/profil/[userId].html" =404; }
    location ~ ^/entreprise-publique/user/[^/]+/?$   { try_files "/entreprise-publique/user/[userId].html" =404; }
    location ~ ^/entreprise-publique/[^/]+/?$        { try_files "/entreprise-publique/[entrepriseId].html" =404; }
    location ~ ^/conversation/[^/]+/?$               { try_files "/conversation/[conversationId].html" =404; }
    location ~ ^/messagerie/[^/]+/?$                 { try_files "/messagerie/[conversationId].html" =404; }
    location ~ ^/administration/entreprises/[^/]+/?$ { try_files "/administration/entreprises/[id].html" =404; }
    location ~ ^/administration/messages/[^/]+/?$    { try_files "/administration/messages/[id].html" =404; }
    location ~ ^/administration/users/[^/]+/?$       { try_files "/administration/users/[id].html" =404; }

    # Pages : /explore → explore.html, /administration → administration/index.html.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /+not-found.html;
}

server {
    listen 443 ssl;
    server_name anoventix.com;

    ssl_certificate     /etc/letsencrypt/live/anoventix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anoventix.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 100m;

    # Verrouillage swagger / OpenAPI / actuator en prod (defense-in-depth) :
    # même si springdoc.*.enabled est mal configuré côté Spring, ces routes ne sortent jamais d'nginx.
    location = /swagger-ui.html        { return 404; }
    location ^~ /swagger-ui/           { return 404; }
    location ^~ /v3/api-docs           { return 404; }
    location ^~ /swagger-resources/    { return 404; }
    location ^~ /webjars/              { return 404; }
    location ^~ /actuator/             { return 404; }

    # Racine du domaine nu : le site est sur www (l'API n'a rien à servir sur « / »).
    location = / {
        return 301 https://www.anoventix.com/;
    }

    # Bloc plus spécifique en premier : nginx applique le préfixe le plus long en priorité.
    # Les pièces d'identité (uploads/private/**) ne sont jamais servies directement ;
    # elles passent obligatoirement par le proxy → Spring Security → endpoint authentifié.
    location /uploads/private/ {
        deny all;
    }

    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # X-Forwarded-For = $remote_addr (et non $proxy_add_x_forwarded_for) : on ÉCRASE la
    # valeur fournie par le client, sinon il peut usurper son IP et contourner le rate limiting.
    location / {
        proxy_pass         http://anoventix-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}

# =============================================================================
#  fleet.anoventix.com — application Fleet (conteneur fleet-api), servie par le
#  même nginx. Ajouté directement sur le serveur à l'origine, versionné ici pour
#  ne plus être écrasé ni bloquer les git pull.
# =============================================================================
server {
    listen 80;
    server_name fleet.anoventix.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fleet.anoventix.com;

    ssl_certificate     /etc/letsencrypt/live/fleet.anoventix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleet.anoventix.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass         http://fleet-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Comme pour l'API AnoventiX : on écrase l'en-tête fourni par le client.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
