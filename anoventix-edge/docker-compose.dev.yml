# Développement local : docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d  (Compose >= 2.24, pour !override).
services:
  nginx:
    ports: !override
      - "80:80"
    volumes: !override
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - app_uploads:/app/uploads:ro

  certbot:
    entrypoint: [ "echo", "certbot désactivé en local" ]
