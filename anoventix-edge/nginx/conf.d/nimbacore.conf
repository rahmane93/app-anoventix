# =============================================================================
#  nimbacore.anoventix.com — application NimbaCore, servie par le même nginx.
#  Config d'origine perdue (elle n'existait que sur le serveur) : recréée ici sur le
#  modèle de fleet.conf et versionnée pour ne plus se perdre.
#  À VÉRIFIER : nom du conteneur et port de l'upstream (proxy_pass ci-dessous).
# =============================================================================
server {
    listen 80;
    server_name nimbacore.anoventix.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nimbacore.anoventix.com;

    ssl_certificate     /etc/letsencrypt/live/nimbacore.anoventix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nimbacore.anoventix.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass         http://nimbacore-api:8080;
        include            /etc/nginx/snippets/proxy-headers.conf;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
