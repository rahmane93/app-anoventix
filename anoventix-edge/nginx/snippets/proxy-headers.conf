# En-têtes communs aux proxy_pass vers les applications.
# X-Forwarded-For = $remote_addr (et non $proxy_add_x_forwarded_for) : on ÉCRASE la
# valeur fournie par le client, sinon il peut usurper son IP et contourner le rate limiting.
proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $remote_addr;
proxy_set_header   X-Forwarded-Proto $scheme;
