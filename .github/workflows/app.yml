name: App

on:
  push:
    branches: [main]
    paths:
      - "anoventix-app/**"
      - "anoventix-api/openapi/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "anoventix-app/**"
      - "anoventix-api/openapi/**"
      - ".github/workflows/app.yml"

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: anoventix-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: anoventix-app/package-lock.json

      - run: npm ci

      # Les types de l'app sont générés depuis le contrat de l'API (anoventix-api/openapi) :
      # un contrat modifié sans « npm run api:types » fait échouer cette étape.
      - name: Types de l'API à jour
        run: npm run api:types:check

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx jest --ci
