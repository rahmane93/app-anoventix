name: API

on:
  push:
    branches: [main]
    paths: ["anoventix-api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["anoventix-api/**", ".github/workflows/api.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: anoventix-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: anoventix-api/pom.xml

      # Les tests lancent PostgreSQL 17 par Testcontainers (Docker est présent sur le runner) :
      # le schéma y est construit par les migrations Flyway depuis une base vide, ce qui vérifie
      # à chaque push qu'une installation neuve fonctionne (ECART-04), et ContratOpenApiTest
      # échoue si le contrat openapi/openapi.json n'a pas été mis à jour.
      - name: Tests
        run: mvn -B verify
